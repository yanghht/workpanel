<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3666cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Мой журнал">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Мой журнал — кабинет преподавателя</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="merge.js" defer></script>
  <script src="cloud-config.js" defer></script>
  <script src="sync.js" defer></script>
  <script src="offline.js" defer></script>
</head>
<body>
  <div class="offline-bar"><span id="offline-status" role="status" aria-live="polite">Проверяем готовность к работе без интернета…</span><button id="offline-update" type="button" hidden>Обновить приложение</button></div>
  <div class="cloud-bar"><span id="cloud-status" role="status" aria-live="polite">Синхронизация не подключена</span><button type="button" data-cloud="open">Аккаунт и синхронизация</button></div>
  <div id="app"></div>
  <dialog id="slot-dialog" class="modal">
    <form id="slot-form">
      <h2>Настройка пары</h2>
      <div id="slot-fields" class="filters"></div>
      <p id="slot-error" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary">Применить</button>
        <button type="button" data-action="close-slot">Отмена</button>
        <button type="button" data-action="delete-slot" class="danger">Удалить пару</button>
      </div>
    </form>
  </dialog>
  <input id="backup-file" type="file" accept=".json,application/json" hidden>
  <dialog id="cloud-dialog" class="modal"><div class="section-head"><h2>Общий журнал</h2><button type="button" data-cloud="close" aria-label="Закрыть синхронизацию">×</button></div><div id="cloud-content"></div></dialog>
  <noscript>Для работы журнала включите JavaScript в браузере.</noscript>
</body>
</html>
